<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alejandro Fernández | Portfolio</title>
    <meta name="description" content="Portfolio de Alejandro Fernández Polo, Desarrollador web y estudiante de Ingeniería Informática.">
    <!-- 🔹 Open Graph (para compartir en redes) -->
    <meta property="og:title" content="Alejandro Fernandez Polo | Portfolio" />
    <meta property="og:description" content="Expola mi portfolio y conoceme." />
    <!-- <meta property="og:image" content="https://tudominio.com/preview.png" /> -->
    <meta property="og:url" content="https://alejandrofernandezpolo.com" />
    <meta property="og:type" content="website" />

    <link rel="icon" type="image/svg+xml" href="/src/assets/favicon.ico" />
    <!-- Solo lo que pinta el primer pantallazo: display (títulos), body y la
         monoespaciada de los kickers. Los pesos 700 y la itálica de Space Mono
         los piden las reglas que los usan, sin bloquear el render inicial.
         Se retiró el preload de Outfit: sin @font-face nunca se llegó a aplicar
         y sólo costaba una petición de 110 KB. -->
    <link
      rel="preload"
      href="/src/assets/fonts/anton-normal-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/src/assets/fonts/archivo-normal-400-700.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/src/assets/fonts/space-mono-normal-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <script>
      document.documentElement.setAttribute(
        "data-theme",
        localStorage.getItem("theme") || "light",
      )
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
