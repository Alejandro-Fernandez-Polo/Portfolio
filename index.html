<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alejandro Fernández Polo | Full Stack Developer</title>
    <meta name="description" content="Portfolio of Alejandro Fernández Polo, web developer and Computer Engineering student.">

    <!-- Open Graph: es lo que leen los crawlers cuando se comparte el enlace.
         Las URLs van absolutas porque son etiquetas estáticas. El idioma es el
         de por defecto de la app (`fallbackLng: "en"` en i18n.js) para que el
         documento no se contradiga: el <html lang> lo acompaña, aunque en
         runtime lo reescriba App.jsx con el idioma detectado. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://alejandrofernandezpolo.com" />
    <meta property="og:title" content="Alejandro Fernández Polo | Full Stack Developer" />
    <meta property="og:description" content="Explore my portfolio and get to know me." />
    <meta property="og:image" content="https://alejandrofernandezpolo.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Alejandro Fernández Polo — Full Stack Developer" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="es_ES" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="https://alejandrofernandezpolo.com/" />

    <!-- Datos estructurados: le dicen a Google qué entidad hay detrás del sitio (una persona,
         no una empresa) y enlazan los perfiles, que es lo que alimenta el panel de
         conocimiento. La `image` apunta a `/og-image.jpg` a propósito: vive en `public/`, así
         que su URL es estable; las de `src/assets/` llevan hash y cambiarían en cada build. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Alejandro Fernández Polo",
        "alternateName": "Alejandro Fernández",
        "jobTitle": "Full Stack Developer",
        "url": "https://alejandrofernandezpolo.com/",
        "image": "https://alejandrofernandezpolo.com/og-image.jpg",
        "sameAs": [
          "https://www.linkedin.com/in/alejandro-fernandez-polo",
          "https://github.com/Alejandro-Fernandez-Polo"
        ],
        "knowsAbout": ["React", "Node.js", "Java", "PHP", "MongoDB", "MySQL"]
      }
    </script>

    <link rel="icon" type="image/x-icon" href="/src/assets/favicon.ico" />
    <!-- iOS compone el icono cuadrado sobre negro si el PNG lleva alfa, así que
         apple-touch-icon.png ya viene con el fondo del sitio pintado. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Solo lo que pinta el primer pantallazo: display (títulos), body y la
         monoespaciada de los kickers. Los pesos 700 y la itálica de Space Mono
         los piden las reglas que los usan, sin bloquear el render inicial. -->
    <link
      rel="preload"
      href="/src/assets/fonts/anton-normal-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/src/assets/fonts/archivo-normal-400-700.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/src/assets/fonts/space-mono-normal-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <!-- Aplicar el tema antes de React evita un flash claro si la última visita dejó el modo oscuro. -->
    <script>
      document.documentElement.setAttribute(
        "data-theme",
        localStorage.getItem("theme") || "light",
      )
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
